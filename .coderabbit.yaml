# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "ko-KR"
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  enable_prompt_for_ai_agents: false
  auto_review:
    enabled: true
    drafts: false
  path_instructions:
    - path: "src/main/java/**/*.java"
      instructions: |
        실행 가능한 결함과 회귀 위험에 집중한다.
        도메인 규칙과 상태 전이의 정확성, 트랜잭션 경계, 동시성 및 멱등성,
        인증과 권한 경계, API 호환성, 예외 및 장애 처리 누락을 검토한다.
        branch, commit, PR 형식이나 기존 하네스와 CI가 강제하는 정적 규칙은
        반복해서 지적하지 않는다.
    - path: "src/test/java/**/*.java"
      instructions: |
        테스트가 중요한 동작과 실패 경로, 경계 조건, 회귀 위험을 실제로
        보호하는지 검토한다. 구현 세부사항만 고정하거나 의미 없는 단언,
        누락된 예외 시나리오가 있으면 지적한다. 테스트 메타데이터와 형식은
        기존 하네스와 CI가 검증하므로 반복해서 지적하지 않는다.
    - path: "src/integrationTest/java/**/*.java"
      instructions: |
        통합 테스트가 트랜잭션, 영속성, 외부 경계, 애플리케이션 구성의 실제
        상호작용을 검증하는지 검토한다. 단위 테스트로 충분한 내용을 반복하거나
        장애 및 롤백 경로를 놓치면 지적한다. 테스트 메타데이터와 형식은 기존
        하네스와 CI가 검증하므로 반복해서 지적하지 않는다.

chat:
  auto_reply: true
