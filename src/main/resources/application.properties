spring.application.name=qello
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-migration-naming=true
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.session.store-type=jdbc
# 세션 테이블은 Flyway가 소유한다(V6). 라이브러리 자동 초기화를 끈다.
spring.session.jdbc.initialize-schema=never

# 스펙 엔드포인트를 기본으로 끈다. 운영에서는 라우트 자체가 생기지 않으므로
# 인증 규칙에 기대지 않고 노출을 막는다. 스펙은 docs/api/openapi.json으로 커밋하며
# 생성은 local과 test 프로필에서만 한다.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
# CI가 스펙 산출물의 변경 여부로 자동 커밋을 판단하므로 키 순서가 안정적이어야 한다.
springdoc.writer-with-order-by-keys=true

qello.direction.receive-capacity=5
# 발송 한 건에서 확정할 수 있는 최대 수신자 수. 운영 실험에 따라 조정한다.
qello.direction.max-recipients-per-post=10
# 방향 칩과 구간 필터가 참조할 ACTIVE direction_scheme의 code.
qello.direction.scheme-code=OCTANT
# 질문글은 국가·대략 지역과 무관하게 방향·거리로 후보를 찾는다.
qello.direction.post.delivery-scope=GLOBAL
qello.direction.post.min-distance-meters=0
qello.direction.post.max-distance-meters=20100000
qello.direction.post.ttl=PT12H
qello.direction.post.max-body-code-points=300
qello.direction.post.max-media-count=1
# 넘김 되돌리기 유예 시간. 이 시간이 지나야 SKIPPED로 확정되고 슬롯이 해제된다.
qello.direction.skip-confirmation-grace-seconds=5
# 마지막 관측 위치를 신규 매칭에 사용할 수 있는 MVP 기간.
qello.direction.presence.ttl=PT24H
# 위치 갱신 요청에서 허용하는 최대 수평 정확도(m).
qello.direction.presence.max-accuracy-meters=100
# 기기와 서버 시계 차이로 미래로 보이는 관측 시각의 허용 오차.
qello.direction.presence.max-future-skew=PT30S
# API가 받아들이는 과거 위치 관측값의 최대 나이.
qello.direction.presence.max-observation-age=PT5M
# 정확 거리 노출의 근거리 하한. 이 미만은 distance_band만 나간다.
qello.feed.near-distance-floor-m=10000
qello.media.allowed-mime-types=image/jpeg,image/png
qello.media.max-byte-size=10485760
qello.media.upload-url-ttl=PT10M
qello.media.s3.region=ap-northeast-2
