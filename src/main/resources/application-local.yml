spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${QELLO_DB_HOST:localhost}:${QELLO_DB_PORT:5432}/${QELLO_DB_NAME:qello}
    username: ${QELLO_DB_USERNAME:qello}
    password: ${QELLO_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000

# 로컬에서 스펙을 눈으로 확인할 수 있게 켠다. 운영 기본값은 여전히 꺼져 있다.
springdoc:
  api-docs:
    enabled: true

qello:
  media:
    bucket: ${QELLO_MEDIA_BUCKET:qello-local-dev}
  auth:
    access-token:
      secret: ${QELLO_AUTH_ACCESS_TOKEN_SECRET}

management:
  endpoints:
    web:
      # compose.yaml의 app healthcheck가 이 endpoint를 확인한다(#230). health만
      # 열고 다른 endpoint는 운영 기본값(닫힘)을 유지한다.
      exposure:
        include: health
  endpoint:
    health:
      # enabled-by-default(운영 기본값)가 false라 exposure.include와 별개로
      # endpoint 자체를 켜야 한다.
      enabled: true
      show-details: never
