spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${QELLO_DB_HOST:localhost}:${QELLO_DB_PORT:5432}/${QELLO_DB_NAME:qello}
    username: ${QELLO_DB_USERNAME:qello}
    password: ${QELLO_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000

# 로컬에서 스펙을 눈으로 확인할 수 있게 켠다. 운영 기본값은 여전히 꺼져 있다.
springdoc:
  api-docs:
    enabled: true

qello:
  media:
    bucket: ${QELLO_MEDIA_BUCKET:qello-local-dev}
  auth:
    access-token:
      secret: ${QELLO_AUTH_ACCESS_TOKEN_SECRET}
