logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}
        version: ${QELLO_APP_VERSION:unknown}

management:
  server:
    # API listener와 관리 listener를 분리한다(#218 DEC-B1-001). host 비공개는
    # bind address가 아니라 Compose의 port 경계가 보장하므로 address를 묶지 않는다.
    # Prometheus 컨테이너가 다른 컨테이너에서 이 포트에 접근해야 한다.
    port: 8081
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      enabled: true
      # DB·디스크 세부 상태는 관리 포트에서도 노출하지 않는다.
      show-details: never
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
