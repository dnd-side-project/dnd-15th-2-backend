plugins {
	id 'java'
	id 'checkstyle'
	id 'com.diffplug.spotless' version '8.10.1'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.dnd'
version = '0.0.1-SNAPSHOT'
description = 'Qello backend'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

checkstyle {
	toolVersion = '14.1.0'
	configFile = file('config/checkstyle/checkstyle.xml')
}

spotless {
	encoding 'UTF-8'
	ratchetFrom 'origin/main'

	java {
		target 'src/**/*.java'
		eclipse('4.26').configFile('config/spotless/eclipse-java-formatter.xml')
		importOrderFile('config/spotless/java-import-order.txt')
	}
}

sourceSets {
	integrationTest {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += output + compileClasspath
	}
}

configurations {
	integrationTestImplementation.extendsFrom testImplementation
	integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
	implementation platform('software.amazon.awssdk:bom:2.51.1')

	implementation 'org.flywaydb:flyway-core'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'com.google.auth:google-auth-library-oauth2-http:1.50.0'
  
	// S3 presigned URL 발급과 HeadObject 검증에만 사용하는 동기 클라이언트.
	// 처리량이 낮은 업로드 확인 용도
	implementation 'software.amazon.awssdk:s3'
	implementation 'software.amazon.awssdk:url-connection-client'

	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.session:spring-session-jdbc'
	implementation 'org.springframework.security:spring-security-crypto'
	// OpenAPI 스펙 생성 전용. Swagger UI 번들(-ui)은 넣지 않는다. UI를 서빙하면
	// 그 자체가 공격면이 되고, 스펙 산출물은 docs/api/openapi.json으로 커밋한다.
	//
	// Spring Boot BOM이 springdoc을 관리하지 않으므로 버전을 직접 고정한다.
	// 3.x는 Spring Boot 4 계열 대상이라 현재 3.5.x에는 2.8 라인을 쓴다.
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:2.8.17'
	// Micrometer의 MeterRegistry만 쓴다(#113). exporter를 붙이지 않는 이유는
	// 관측·경보 도구가 아직 미결정이기 때문이다 — Micrometer는 vendor-neutral
	// 추상이라 지금 계측해 두고 backend는 나중에 고를 수 있다.
	//
	// actuator의 web endpoint는 application.yml에서 전부 닫는다. springdoc을
	// 운영 기본 api-docs.enabled=false로 둔 것과 같은 처리이며, 열린 관리
	// endpoint 자체가 공격면이 된다.
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.2'
	testImplementation 'com.github.javaparser:javaparser-core:3.28.2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'

	integrationTestImplementation 'org.springframework.boot:spring-boot-testcontainers'
	integrationTestImplementation 'org.testcontainers:junit-jupiter'
	integrationTestImplementation 'org.testcontainers:postgresql'
	integrationTestImplementation 'org.testcontainers:localstack'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.withType(Checkstyle).configureEach {
	maxWarnings = 0
	configProperties = [
		qelloBaselineSuppressions: layout.buildDirectory
			.file('generated/checkstyle/baseline-suppressions.xml').get().asFile.absolutePath
	]
}

tasks.register('checkstyleFixture', Checkstyle) {
	description = 'Runs Checkstyle against one Java fixture passed as qelloStaticFixture.'
	group = 'verification'
	classpath = files()
	configFile = file('config/checkstyle/checkstyle.xml')
	maxWarnings = 0

	def fixturePath = providers.gradleProperty('qelloStaticFixture')
	source fixturePath.isPresent() ? files(fixturePath.get()) : files()
	dependsOn 'validateJavaConventionBaseline'
}

tasks.register('validateJavaConventionBaseline', Exec) {
	description = 'Validates Java convention baseline metadata.'
	group = 'verification'
	def suppressionOutput = layout.buildDirectory.file('generated/checkstyle/baseline-suppressions.xml')
	outputs.file(suppressionOutput)
	inputs.file('config/java-conventions/baseline.json')
	inputs.file('TASK.md')
	commandLine 'python3', 'scripts/validate-java-conventions.py',
		'--suppression-output', suppressionOutput.get().asFile.absolutePath
}

tasks.register('javaConventionSourceTest', Test) {
	description = 'Runs Java source convention tests.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	filter {
		includeTestsMatching '*JavaSourceConventionTest'
	}
}

tasks.register('javaConventionArchitectureTest', Test) {
	description = 'Runs Java architecture convention tests.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	filter {
		includeTestsMatching '*JavaConventionArchitectureTest'
		includeTestsMatching '*ProductionConvention*'
		includeTestsMatching '*ChangedJavaTypesTest'
	}
	def manifest = providers.gradleProperty('qelloConventionManifest')
	if (manifest.isPresent()) {
		systemProperty 'qelloConventionManifest', manifest.get()
	}
}

def conventionManifestFiles = {
	def manifestProperty = providers.gradleProperty('qelloConventionManifest')
	if (!manifestProperty.isPresent()) {
		return files()
	}
	def manifestPath = file(manifestProperty.get()).canonicalFile
	def repositoryRoot = rootDir.canonicalFile
	def manifest = new groovy.json.JsonSlurper().parse(manifestPath)
	def paths = manifest.paths
	if (!(paths instanceof List)) {
		throw new GradleException('qelloConventionManifest.paths must be an array')
	}
	def resolved = paths.collect { relativePath ->
		if (!(relativePath instanceof String) || !relativePath.endsWith('.java')) {
			throw new GradleException('staged convention manifest contains a non-Java path')
		}
		def candidate = file(relativePath).canonicalFile
		if (!candidate.toPath().startsWith(repositoryRoot.toPath())) {
			throw new GradleException('staged convention manifest escapes the repository')
		}
		candidate
	}
	if (resolved.toSet().size() != resolved.size()) {
		throw new GradleException('staged convention manifest contains duplicate paths')
	}
	files(resolved)
}

tasks.register('checkstyleStagedJava', Checkstyle) {
	description = 'Runs Checkstyle against staged Java files from qelloConventionManifest.'
	group = 'verification'
	classpath = sourceSets.main.compileClasspath
	configFile = file('config/checkstyle/checkstyle.xml')
	maxWarnings = 0
	source conventionManifestFiles()
	dependsOn 'validateJavaConventionBaseline'
}

tasks.named('checkstyleMain') {
	dependsOn 'validateJavaConventionBaseline'
}

tasks.matching { it.name == 'checkstyleTest' || it.name == 'checkstyleIntegrationTest' }.configureEach {
	enabled = false
}

tasks.register('javaConventionStagedCheck') {
	description = 'Runs Java convention checks for staged Java files.'
	group = 'verification'
	dependsOn 'spotlessJavaCheck', 'checkstyleStagedJava', 'validateJavaConventionBaseline',
		'javaConventionSourceTest', 'javaConventionArchitectureTest'
}

tasks.register('javaConventionCheck') {
	description = 'Runs the complete Java convention check.'
	group = 'verification'
	dependsOn 'spotlessJavaCheck', 'checkstyleMain', 'validateJavaConventionBaseline',
		'javaConventionSourceTest', 'javaConventionArchitectureTest'
}

tasks.named('check') {
	dependsOn 'javaConventionCheck'
}

tasks.register('integrationTest', Test) {
	description = 'Runs JUnit 5 integration tests.'
	group = 'verification'
	testClassesDirs = sourceSets.integrationTest.output.classesDirs
	classpath = sourceSets.integrationTest.runtimeClasspath
	useJUnitPlatform {
		// 10,000행 합성 데이터 적재는 이 태스크가 아니라 별도 performanceTest에서만
		// 돈다. check가 이 태스크에 의존하므로, 여기 포함하면 모든 로컬 커밋과 CI가
		// 매번 그 적재 비용을 치른다(GH-127 TASK.md 결정).
		excludeTags 'performance'
	}
	shouldRunAfter tasks.named('test')
}

tasks.register('performanceTest', Test) {
	description = 'Runs @Tag("performance") integration tests (10k synthetic scale, EXPLAIN ANALYZE). check에 포함되지 않으며 수동으로만 실행한다.'
	group = 'verification'
	testClassesDirs = sourceSets.integrationTest.output.classesDirs
	classpath = sourceSets.integrationTest.runtimeClasspath
	useJUnitPlatform {
		includeTags 'performance'
	}
	shouldRunAfter tasks.named('integrationTest')
}

tasks.named('check') {
	dependsOn tasks.named('integrationTest')
}
