plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.dnd'
version = '0.0.1-SNAPSHOT'
description = 'Qello backend'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

sourceSets {
	integrationTest {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += output + compileClasspath
	}
}

configurations {
	integrationTestImplementation.extendsFrom testImplementation
	integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
	implementation platform('software.amazon.awssdk:bom:2.51.1')

	implementation 'org.flywaydb:flyway-core'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
  
	// S3 presigned URL 발급과 HeadObject 검증에만 사용하는 동기 클라이언트.
	// 처리량이 낮은 업로드 확인 용도
	implementation 'software.amazon.awssdk:s3'
	implementation 'software.amazon.awssdk:url-connection-client'

	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.session:spring-session-jdbc'
	implementation 'org.springframework.security:spring-security-crypto'
	// OpenAPI 스펙 생성 전용. Swagger UI 번들(-ui)은 넣지 않는다. UI를 서빙하면
	// 그 자체가 공격면이 되고, 스펙 산출물은 docs/api/openapi.json으로 커밋한다.
	//
	// Spring Boot BOM이 springdoc을 관리하지 않으므로 버전을 직접 고정한다.
	// 3.x는 Spring Boot 4 계열 대상이라 현재 3.5.x에는 2.8 라인을 쓴다.
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:2.8.17'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'

	integrationTestImplementation 'org.springframework.boot:spring-boot-testcontainers'
	integrationTestImplementation 'org.testcontainers:junit-jupiter'
	integrationTestImplementation 'org.testcontainers:postgresql'
	integrationTestImplementation 'org.testcontainers:localstack'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('integrationTest', Test) {
	description = 'Runs JUnit 5 integration tests.'
	group = 'verification'
	testClassesDirs = sourceSets.integrationTest.output.classesDirs
	classpath = sourceSets.integrationTest.runtimeClasspath
	useJUnitPlatform {
		// 10,000행 합성 데이터 적재는 이 태스크가 아니라 별도 performanceTest에서만
		// 돈다. check가 이 태스크에 의존하므로, 여기 포함하면 모든 로컬 커밋과 CI가
		// 매번 그 적재 비용을 치른다(GH-127 TASK.md 결정).
		excludeTags 'performance'
	}
	shouldRunAfter tasks.named('test')
}

tasks.register('performanceTest', Test) {
	description = 'Runs @Tag("performance") integration tests (10k synthetic scale, EXPLAIN ANALYZE). check에 포함되지 않으며 수동으로만 실행한다.'
	group = 'verification'
	testClassesDirs = sourceSets.integrationTest.output.classesDirs
	classpath = sourceSets.integrationTest.runtimeClasspath
	useJUnitPlatform {
		includeTags 'performance'
	}
	shouldRunAfter tasks.named('integrationTest')
}

tasks.named('check') {
	dependsOn tasks.named('integrationTest')
}
