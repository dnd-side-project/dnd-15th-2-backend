name: 기술 설계
description: 구현 전에 아키텍처와 의사결정을 검토합니다.
title: "[JIRA] "
labels:
  - "type: docs"
body:
  - type: input
    id: parent_jira
    attributes:
      label: 상위 Jira 티켓
      placeholder: PROJ-123
    validations:
      required: true
  - type: dropdown
    id: work_type
    attributes:
      label: 작업 유형
      options:
        - 기술 설계
        - ADR
        - API 설계
        - 데이터 설계
    validations:
      required: true
  - type: textarea
    id: work
    attributes:
      label: 작업 내용
      description: 문제, 제약, 결정할 범위를 작성합니다.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 검토할 대안
      description: 최소 두 가지와 장단점을 작성합니다.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      placeholder: |
        - [ ] 선택안과 근거
        - [ ] 대안 비교
        - [ ] 실패/복구 경로
        - [ ] 후속 작업
    validations:
      required: true
  - type: textarea
    id: backend_impact
    attributes:
      label: 백엔드 영향
    validations:
      required: true
  - type: textarea
    id: blockers
    attributes:
      label: 의존성 또는 블로커
    validations:
      required: true
