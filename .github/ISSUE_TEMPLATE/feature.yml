name: 기능 작업
description: Jira 요구사항을 구현 가능한 백엔드 작업으로 연결합니다.
title: "[JIRA] "
labels:
  - "type: feature"
body:
  - type: markdown
    attributes:
      value: |
        Jira가 일정과 범위의 기준입니다. 상위 Jira 티켓을 먼저 확인하고 작성해 주세요.
  - type: input
    id: parent_jira
    attributes:
      label: 상위 Jira 티켓
      description: 예) PAY-314
      placeholder: PROJ-123
    validations:
      required: true
  - type: dropdown
    id: work_type
    attributes:
      label: 작업 유형
      options:
        - 기능
        - 리팩터링
        - 문서
    validations:
      required: true
  - type: textarea
    id: work
    attributes:
      label: 작업 내용
      description: 사용자 문제와 구현 범위를 작성합니다.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 검증 가능한 조건으로 작성합니다.
      placeholder: |
        - [ ] 정상 흐름
        - [ ] 예외 흐름
        - [ ] 테스트 및 문서
    validations:
      required: true
  - type: textarea
    id: backend_impact
    attributes:
      label: 백엔드 영향
      description: API, DB, 트랜잭션, 외부 연동, 운영 영향
    validations:
      required: true
  - type: textarea
    id: blockers
    attributes:
      label: 의존성 또는 블로커
      description: 없으면 "없음"이라고 작성합니다.
    validations:
      required: true
