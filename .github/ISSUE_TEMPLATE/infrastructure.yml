name: AWS 인프라 설계·구축
description: 비용, 보안, 대안을 먼저 검토하고 적용은 수동 승인합니다.
title: ""
labels:
  - "type: infrastructure"
  - "area: operations"
body:
  - type: dropdown
    id: work_type
    attributes:
      label: 작업 유형
      options:
        - 인프라 설계
        - IaC 구현
        - 운영 변경
    validations:
      required: true
  - type: textarea
    id: work
    attributes:
      label: 작업 내용
      description: 설계/plan 범위를 작성합니다. apply는 별도 승인 단계입니다.
    validations:
      required: true
  - type: dropdown
    id: iac
    attributes:
      label: IaC
      options:
        - Terraform
        - AWS CDK
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 대안과 비용 가정
      description: EC2/ECS, RDS/자체 운영, 공식 AWS 가격 근거를 포함합니다.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      placeholder: |
        - [ ] 설계 보고서
        - [ ] least-privilege IAM
        - [ ] fmt/validate/static/plan
        - [ ] @Byuntil, @tkv00 리뷰 요청
        - [ ] apply 기본 비활성
    validations:
      required: true
  - type: textarea
    id: backend_impact
    attributes:
      label: 백엔드 영향
      description: 배포, DB, 네트워크, 복구, 비용 영향
    validations:
      required: true
  - type: textarea
    id: blockers
    attributes:
      label: 의존성 또는 블로커
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 안전 확인
      options:
        - label: 이 이슈와 PR에 비밀 키, 주소, IAM/계정 ID, 토큰, .env 값을 기록하지 않습니다.
          required: true
        - label: 두 백엔드 승인과 명시적 사람 확인 전에는 apply/deploy하지 않습니다.
          required: true
