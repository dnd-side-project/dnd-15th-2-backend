name: 백엔드 작업
description: ClickUp 스프린트 작업에 백엔드 구현과 검증 증거를 연결합니다.
title: ""
labels:
  - "area: api"
body:
  - type: markdown
    attributes:
      value: |
        제목은 [기능명세서 ID] 이번 주에 끝낼 산출물로 작성합니다.
        일정·담당자·기한·우선순위·상태는 ClickUp 작업에서 관리합니다.
        Android와 Backend는 별도 작업으로 만들고 같은 기능명세서 ID를 연결합니다.
        팀 전체 보드에는 파트별 작업을 별도로 복제하지 않습니다.
        ClickUp 태그는 feature / bug / tech-debt / research만 사용하며,
        GitHub의 기존 canonical type 라벨·커밋 규칙은 유지합니다.
        입력한 ID·URL의 일치와 링크 유효성은 리뷰에서 확인합니다.

  - type: input
    id: clickup_task_id
    attributes:
      label: ClickUp 작업 ID
      description: 작업 URL에 있는 실제 task ID입니다. 목록 ID나 팀 스프린트 ID가 아닙니다.
      placeholder: "<CLICKUP-TASK-ID>"
    validations:
      required: true

  - type: input
    id: clickup_task_url
    attributes:
      label: ClickUp 작업 URL
      placeholder: "https://app.clickup.com/t/<CLICKUP-TASK-ID>"
    validations:
      required: true

  - type: input
    id: feature_spec_id
    attributes:
      label: 기능명세서 ID
      description: 관련 명세 ID를 입력합니다. 명세가 없는 도구·기술부채 작업은 해당 없음과 사유를 씁니다.
      placeholder: "QELLO-AUTH-001 또는 해당 없음: 사유"
    validations:
      required: true

  - type: input
    id: feature_spec_url
    attributes:
      label: 기능명세서 링크
      description: ClickUp 원본 명세 링크입니다. 명세가 없으면 해당 없음과 사유를 씁니다.
    validations:
      required: true

  - type: input
    id: sprint_id
    attributes:
      label: 팀 스프린트 ID
      description: 이번 작업을 합의한 팀 주기를 입력합니다. ClickUp이 발급한 task/list ID와 구분합니다.
      placeholder: "QELLO-SYYYY-Www"
    validations:
      required: true

  - type: dropdown
    id: work_type
    attributes:
      label: 작업 유형
      options:
        - feat
        - fix
        - refactor
        - test
        - docs
        - chore
        - config
        - infrastructure
        - performance
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: 이번 주 산출물·구현 범위
      description: 이번 주에 검증할 산출물, 필요한 이유와 제외 범위를 작성합니다.
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 완료 조건·검증 방법
      description: 관찰 가능한 결과 1~3개와 각 결과의 검증 방법을 작성합니다. PR 병합만으로 완료하지 않습니다.
      placeholder: |
        - [ ] 관찰할 결과 1 — 검증 방법:
        - [ ] 관찰할 결과 2 — 검증 방법:
    validations:
      required: true

  - type: textarea
    id: backend_impact
    attributes:
      label: 백엔드 영향
      description: API, DB, 권한, 외부 연동 영향이 없으면 N/A로 작성합니다.
      placeholder: |
        API:
        DB:
        권한:
        외부 연동:
    validations:
      required: true

  - type: textarea
    id: related_links
    attributes:
      label: 관련 작업·화면·PR
      description: Android 작업은 별도 ClickUp URL로 연결하고 같은 명세 ID를 사용합니다. Figma는 화면 작업만 연결합니다.
      value: |
        관련 Android 작업: 해당 없음 또는 ClickUp URL
        Figma: 해당 없음 또는 링크
        GitHub PR: 미정
    validations:
      required: true

  - type: textarea
    id: verification_evidence
    attributes:
      label: 검증 결과·증빙
      description: 실행 후 명령·환경·실제 결과와 테스트 또는 시연 링크를 갱신합니다. 미실행을 성공으로 표시하지 않습니다.
      value: 미실행
    validations:
      required: true

  - type: textarea
    id: blockers
    attributes:
      label: 의존성 또는 블로커
      description: 선행 작업이나 미결정 사항이 없으면 N/A로 작성합니다.
      value: N/A

  - type: checkboxes
    id: linkage_review
    attributes:
      label: 연결·범위 확인
      options:
        - label: 주간 계획에서 합의한 ClickUp 작업이며 팀 전체 보드에 중복 작업을 만들지 않았습니다.
          required: true
        - label: 기능명세서는 요구 동작, 이 작업은 이번 주 산출물과 검증 방법을 기록합니다.
          required: true
