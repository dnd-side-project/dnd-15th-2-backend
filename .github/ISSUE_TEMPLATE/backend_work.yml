name: 백엔드 작업
description: 구현 가능한 백엔드 작업과 완료 조건을 기록합니다.
title: ""
labels:
  - "area: api"
body:
  - type: markdown
    attributes:
      value: |
        일정·우선순위·스프린트·상태는 GitHub Project 필드에서 관리합니다.
        이슈에는 canonical type 라벨이 정확히 하나 필요합니다.

  - type: dropdown
    id: work_type
    attributes:
      label: 작업 유형
      options:
        - feat
        - fix
        - refactor
        - test
        - docs
        - chore
        - config
        - infrastructure
        - performance
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: 작업 내용
      description: 구현할 내용과 필요한 이유를 간단히 작성합니다.
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 완료 조건
      placeholder: |
        - [ ] 완료 조건 1
        - [ ] 완료 조건 2
    validations:
      required: true

  - type: textarea
    id: backend_impact
    attributes:
      label: 백엔드 영향
      description: API, DB, 권한, 외부 연동 영향이 없으면 N/A로 작성합니다.
      placeholder: |
        API:
        DB:
        권한:
        외부 연동:
    validations:
      required: true

  - type: textarea
    id: blockers
    attributes:
      label: 의존성 또는 블로커
      description: 선행 작업이나 미결정 사항이 없으면 N/A로 작성합니다.
      value: N/A
