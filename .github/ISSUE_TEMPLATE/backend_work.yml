name: 백엔드 작업
description: 상위 Jira 티켓 아래에 백엔드 하위 작업과 브랜치를 자동 생성합니다.
title: "[JIRA] "
labels:
  - "area: api"
body:
  - type: markdown
    attributes:
      value: |
        상위 Jira 티켓을 입력하면 Jira 하위 작업과 작업 브랜치가 자동 생성됩니다.
        일정·우선순위·상태의 기준은 Jira입니다.

  - type: input
    id: parent_jira
    attributes:
      label: 상위 Jira 티켓
      description: 하위 작업을 생성할 Jira 티켓 키를 입력합니다.
      placeholder: MIRI-100
    validations:
      required: true

  - type: dropdown
    id: work_type
    attributes:
      label: 작업 유형
      options:
        - feat
        - fix
        - refactor
        - test
        - docs
        - chore
        - config
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: 작업 내용
      description: 구현할 내용과 필요한 이유를 간단히 작성합니다.
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 완료 조건
      placeholder: |
        - [ ] 완료 조건 1
        - [ ] 완료 조건 2
    validations:
      required: true

  - type: textarea
    id: backend_impact
    attributes:
      label: 백엔드 영향
      description: API, DB, 권한, 외부 연동 영향이 없으면 N/A로 작성합니다.
      placeholder: |
        API:
        DB:
        권한:
        외부 연동:
    validations:
      required: true

  - type: textarea
    id: blockers
    attributes:
      label: 의존성 또는 블로커
      description: 선행 작업이나 미결정 사항이 없으면 N/A로 작성합니다.
      value: N/A
