name: Jira Sync

on:
  issues:
    types: [opened, reopened, closed]
  pull_request:
    types: [opened, edited, reopened, closed]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  sync-issue:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    env:
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_CHILD_ISSUE_TYPE_ID: ${{ vars.JIRA_CHILD_ISSUE_TYPE_ID }}
      JIRA_CHILD_ISSUE_TYPE_NAME: ${{ vars.JIRA_CHILD_ISSUE_TYPE_NAME }}
    steps:
      - name: Create or update Jira work item
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const action = context.payload.action;
            const baseUrl = (process.env.JIRA_BASE_URL || "").replace(/\/+$/, "");
            const email = process.env.JIRA_EMAIL || "";
            const token = process.env.JIRA_API_TOKEN || "";

            if (!baseUrl || !email || !token) {
              core.setFailed("JIRA_BASE_URL, JIRA_EMAIL, JIRA_API_TOKEN secrets are required.");
              return;
            }

            const auth = Buffer.from(`${email}:${token}`).toString("base64");

            async function jira(path, options = {}) {
              const response = await fetch(`${baseUrl}${path}`, {
                ...options,
                headers: {
                  Accept: "application/json",
                  Authorization: `Basic ${auth}`,
                  ...(options.body ? { "Content-Type": "application/json" } : {}),
                  ...options.headers,
                },
              });

              const text = await response.text();
              let data = null;
              if (text) {
                try {
                  data = JSON.parse(text);
                } catch {
                  data = text;
                }
              }

              if (!response.ok) {
                throw new Error(
                  `${options.method || "GET"} ${path} -> ${response.status}\n` +
                  (typeof data === "string" ? data : JSON.stringify(data, null, 2))
                );
              }

              return data;
            }

            function extract(label) {
              const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const match = (issue.body || "").match(
                new RegExp(`### ${escaped}\\s*\\n+([\\s\\S]*?)(?=\\n+### |$)`, "i")
              );
              if (!match) return "";
              const value = match[1].trim();
              return value === "_No response_" ? "" : value;
            }

            function jiraKey(value) {
              return (value || "").toUpperCase().match(/\b[A-Z][A-Z0-9]+-\d+\b/)?.[0] || "";
            }

            function cleanTitle(value) {
              return (value || "")
                .replace(/^\[(?:JIRA|[A-Z][A-Z0-9]+-\d+)\]\s*/i, "")
                .trim();
            }

            function branchSlug(value, issueNumber) {
              const slug = String(value || "")
                .normalize("NFKD")
                .replace(/[\u0300-\u036f]/g, "")
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, "-")
                .replace(/^-+|-+$/g, "")
                .replace(/-{2,}/g, "-")
                .slice(0, 48)
                .replace(/-+$/g, "");
              return slug || `issue-${issueNumber}`;
            }

            function paragraph(text) {
              const content = [];
              String(text || "-").split(/\r?\n/).forEach((line, index) => {
                if (index > 0) content.push({ type: "hardBreak" });
                if (line) content.push({ type: "text", text: line });
              });
              return {
                type: "paragraph",
                content: content.length ? content : [{ type: "text", text: "-" }],
              };
            }

            async function transition(key, targetNames) {
              try {
                const result = await jira(`/rest/api/3/issue/${key}/transitions`);
                const normalized = targetNames.map((name) => name.toLowerCase());
                const target = result.transitions?.find((item) =>
                  normalized.includes((item.name || "").toLowerCase()) ||
                  normalized.includes((item.to?.name || "").toLowerCase())
                );

                if (!target) {
                  core.warning(`${key}: 사용할 수 있는 상태 전환을 찾지 못했습니다.`);
                  return;
                }

                await jira(`/rest/api/3/issue/${key}/transitions`, {
                  method: "POST",
                  body: JSON.stringify({ transition: { id: target.id } }),
                });
              } catch (error) {
                core.warning(`${key}: 상태 전환을 건너뜁니다. ${error.message}`);
              }
            }

            let childKey = jiraKey(issue.title);

            if (action === "closed") {
              if (childKey) {
                await transition(childKey, ["Done", "완료"]);
              }
              return;
            }

            if (!["opened", "reopened"].includes(action)) return;

            const parentKey = jiraKey(extract("상위 Jira 티켓"));
            if (!parentKey && !childKey) {
              core.notice("상위 Jira 티켓이 없는 이슈이므로 Jira 동기화를 건너뜁니다.");
              return;
            }

            const title = cleanTitle(issue.title);
            let branchName = "";

            if (!childKey) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                per_page: 100,
              });
              childKey = comments
                .map((comment) => (comment.body || "").match(/<!--\s*jira-child:([A-Z][A-Z0-9]+-\d+)\s*-->/)?.[1])
                .find(Boolean) || "";
            }

            if (!childKey) {
              const parent = await jira(
                `/rest/api/3/issue/${encodeURIComponent(parentKey)}?fields=project,summary`
              );
              const issueTypeId = (process.env.JIRA_CHILD_ISSUE_TYPE_ID || "").trim();
              const issueTypeName =
                (process.env.JIRA_CHILD_ISSUE_TYPE_NAME || "").trim() || "작업";
              const sections = [
                ["GitHub", issue.html_url],
                ["작업 유형", extract("작업 유형")],
                ["작업 내용", extract("작업 내용")],
                ["완료 조건", extract("완료 조건")],
                ["백엔드 영향", extract("백엔드 영향")],
                ["의존성 또는 블로커", extract("의존성 또는 블로커")],
              ];

              const created = await jira("/rest/api/3/issue", {
                method: "POST",
                body: JSON.stringify({
                  fields: {
                    project: { key: parent.fields.project.key },
                    parent: { key: parentKey },
                    issuetype: issueTypeId
                      ? { id: issueTypeId }
                      : { name: issueTypeName },
                    summary: title,
                    description: {
                      type: "doc",
                      version: 1,
                      content: sections.flatMap(([label, value]) => [
                        paragraph(label),
                        paragraph(value),
                      ]),
                    },
                  },
                }),
              });
              childKey = created.key;

              try {
                const boards = await jira(
                  `/rest/agile/1.0/board?projectKeyOrId=${encodeURIComponent(parent.fields.project.key)}&type=scrum`
                );
                const boardId = boards.values?.[0]?.id;
                if (boardId) {
                  const sprints = await jira(
                    `/rest/agile/1.0/board/${boardId}/sprint?state=active`
                  );
                  const sprintId = sprints.values?.[0]?.id;
                  if (sprintId) {
                    await jira(`/rest/agile/1.0/sprint/${sprintId}/issue`, {
                      method: "POST",
                      body: JSON.stringify({ issues: [childKey] }),
                    });
                  }
                }
              } catch (error) {
                core.warning(`${childKey}: 현재 스프린트 자동 할당을 건너뜁니다. ${error.message}`);
              }
            }

            await transition(childKey, ["In Progress", "진행 중"]);

            const workType = extract("작업 유형").toLowerCase();
            const branchTypes = new Set([
              "feat",
              "feature",
              "fix",
              "test",
              "infra",
              "docs",
              "refactor",
              "chore",
              "ci",
              "build",
              "perf",
            ]);
            const prefix = workType === "config"
              ? "chore"
              : branchTypes.has(workType) ? workType : "chore";
            const slug = branchSlug(title, issue.number);
            branchName = `${prefix}/${childKey}-gh-${issue.number}-${slug}`;

            try {
              const repository = await github.rest.repos.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              const defaultBranch = await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: repository.data.default_branch,
              });
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/heads/${branchName}`,
                sha: defaultBranch.data.commit.sha,
              });
            } catch (error) {
              if (error.status !== 422) {
                core.warning(`브랜치 자동 생성을 건너뜁니다. ${error.message}`);
              }
            }

            const nextTitle = `[${childKey}] ${title}`;
            if (issue.title !== nextTitle) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                title: nextTitle,
              });
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100,
            });
            const marker = `<!-- jira-child:${childKey} -->`;
            if (!comments.some((comment) => (comment.body || "").includes(marker))) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: [
                  marker,
                  "### Jira 연동 완료",
                  `- 하위 티켓: [${childKey}](${baseUrl}/browse/${childKey})`,
                  `- 상위 티켓: [${parentKey}](${baseUrl}/browse/${parentKey})`,
                  `- 작업 브랜치: \`${branchName}\``,
                ].join("\n"),
              });
            }

  sync-pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
    steps:
      - name: Connect pull request to Jira
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const action = context.payload.action;
            const keyPattern = /\b[A-Z][A-Z0-9]+-\d+\b/i;
            const issuePattern =
              /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/i;

            let key =
              pr.head.ref.match(keyPattern)?.[0]?.toUpperCase() ||
              pr.title.match(keyPattern)?.[0]?.toUpperCase() ||
              (pr.body || "").match(keyPattern)?.[0]?.toUpperCase() ||
              "";

            if (!key) {
              const issueNumber = (pr.body || "").match(issuePattern)?.[1];
              if (issueNumber) {
                const linkedIssue = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: Number(issueNumber),
                });
                key = linkedIssue.data.title.match(keyPattern)?.[0]?.toUpperCase() || "";
              }
            }

            if (!key) {
              core.setFailed(
                "Jira 키를 찾지 못했습니다. 자동 생성된 Jira 작업 브랜치를 사용하거나 PR 본문에 `Closes #이슈번호`를 입력하세요."
              );
              return;
            }

            if (["opened", "edited", "reopened"].includes(action)) {
              const cleanTitle = pr.title
                .replace(/^\[[A-Z][A-Z0-9]+-\d+\]\s*/i, "")
                .trim();
              const nextTitle = `[${key}] ${cleanTitle}`;
              if (pr.title !== nextTitle) {
                await github.rest.pulls.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  title: nextTitle,
                });
              }
            }

            if (action !== "closed" || !pr.merged) return;

            const baseUrl = (process.env.JIRA_BASE_URL || "").replace(/\/+$/, "");
            const email = process.env.JIRA_EMAIL || "";
            const token = process.env.JIRA_API_TOKEN || "";
            if (!baseUrl || !email || !token) {
              core.setFailed("JIRA_BASE_URL, JIRA_EMAIL, JIRA_API_TOKEN secrets are required.");
              return;
            }

            const auth = Buffer.from(`${email}:${token}`).toString("base64");
            const transitionsResponse = await fetch(
              `${baseUrl}/rest/api/3/issue/${key}/transitions`,
              {
                headers: {
                  Accept: "application/json",
                  Authorization: `Basic ${auth}`,
                },
              }
            );
            if (!transitionsResponse.ok) {
              core.setFailed(`Jira 상태 조회 실패: ${transitionsResponse.status}`);
              return;
            }

            const transitions = await transitionsResponse.json();
            const target = transitions.transitions?.find((item) =>
              ["done", "완료"].includes((item.name || "").toLowerCase()) ||
              ["done", "완료"].includes((item.to?.name || "").toLowerCase())
            );

            if (!target) {
              core.warning(`${key}: 완료 상태 전환을 찾지 못했습니다.`);
              return;
            }

            const transitionResponse = await fetch(
              `${baseUrl}/rest/api/3/issue/${key}/transitions`,
              {
                method: "POST",
                headers: {
                  Accept: "application/json",
                  Authorization: `Basic ${auth}`,
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({ transition: { id: target.id } }),
              }
            );
            if (!transitionResponse.ok) {
              core.setFailed(`Jira 완료 전환 실패: ${transitionResponse.status}`);
            }
