name: Deploy Test Server

# dev 테스트 서버(#229)에만 배포한다. production 배포와 무중단 배포
# 전략은 이 workflow의 범위가 아니다(#231 제외 항목). 롤백은 자동화하지
# 않는다 — 이전 커밋 태그로 재배포하는 절차는 README.md에 문서화한다.
#
# 이미지에 영향을 주지 않는 변경(문서, 테스트 계획 등)까지 매번
# 재배포하지 않도록 애플리케이션 빌드 산출물에 실제로 영향을 주는
# 경로만 트리거로 둔다.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Dockerfile"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_TEST_SERVER_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Log in to ECR
        run: >-
          aws ecr get-login-password --region "${{ vars.AWS_REGION }}" |
          docker login --username AWS --password-stdin "${{ vars.ECR_REPOSITORY_URL }}"

      - name: Build runtime image
        run: docker build -t "${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}" .

      # 배포된 이미지를 commit으로 추적하기 위해 SHA 태그를 우선 push하고,
      # EC2의 compose.yaml이 참조하는 latest 태그를 같은 이미지로 갱신한다.
      - name: Tag latest
        run: docker tag "${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}" "${{ vars.ECR_REPOSITORY_URL }}:latest"

      - name: Push images
        run: |
          docker push "${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}"
          docker push "${{ vars.ECR_REPOSITORY_URL }}:latest"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_TEST_SERVER_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      # docker compose pull/up과 헬스체크를 하나의 SSM 명령으로 묶는다.
      # 헬스체크가 실패하면 이 명령 자체가 실패 상태로 끝나고, 그 상태를
      # 아래 단계가 그대로 workflow 실패로 이어받는다.
      - name: Deploy over SSM and wait for health check
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          INSTANCE_ID: ${{ vars.TEST_SERVER_INSTANCE_ID }}
        run: |
          set -euo pipefail

          cat > /tmp/ssm-params.json <<'JSON'
          {
            "commands": [
              "set -e",
              "cd /opt/qello",
              "docker compose --env-file .env pull",
              "docker compose --env-file .env up -d",
              "for i in $(seq 1 30); do curl -fsS http://localhost:8080/actuator/health >/dev/null 2>&1 && exit 0; sleep 2; done",
              "echo health check timed out >&2",
              "exit 1"
            ]
          }
          JSON

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy-test-server (#231)" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)

          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" --output text)
          echo "SSM command status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "--- stderr ---"
            aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "StandardErrorContent" --output text
            exit 1
          fi
