name: Deploy Test Server

# dev 테스트 서버(#229)에만 배포한다. production 배포와 무중단 배포
# 전략은 이 workflow의 범위가 아니다(#231 제외 항목). 실패 후 app 롤백은
# 사람이 이전 SHA와 보관한 구성 세트를 선택해 실행한다.
#
# 이미지에 영향을 주지 않는 변경(문서, 테스트 계획 등)까지 매번
# 재배포하지 않도록 애플리케이션 빌드 산출물에 실제로 영향을 주는
# 경로만 트리거로 둔다.
# 이미지에 포함되지 않는 단위·통합 테스트 경로는 자동 배포에서 제외한다.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "!src/test/**"
      - "!src/integrationTest/**"
      - "Dockerfile"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew"
  workflow_dispatch:
    inputs:
      image_sha:
        description: "배포할 기존 ECR 이미지의 40자리 lowercase commit SHA (선택)"
        required: false
        type: string

concurrency:
  group: deploy-test-server
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_sha: ${{ steps.resolve-image.outputs.image_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_TEST_SERVER_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Resolve or build immutable SHA image
        id: resolve-image
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
          REQUESTED_IMAGE_SHA: ${{ inputs.image_sha }}
          DEFAULT_IMAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$AWS_REGION" in ''|*[!a-zA-Z0-9._-]*) echo "Invalid AWS_REGION" >&2; exit 1 ;; esac
          if ! [[ "$ECR_REPOSITORY_URL" =~ ^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com(\.cn)?/[a-z0-9][a-z0-9._/-]*$ ]] || [[ "$ECR_REPOSITORY_URL" == */*//* || "$ECR_REPOSITORY_URL" == */ ]]; then
            echo "Invalid ECR_REPOSITORY_URL" >&2; exit 1
          fi
          ECR_REGISTRY="${ECR_REPOSITORY_URL%%/*}"
          ECR_REPOSITORY="${ECR_REPOSITORY_URL#*/}"
          IMAGE_SHA="${REQUESTED_IMAGE_SHA:-$DEFAULT_IMAGE_SHA}"
          if ! [[ "$IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]]; then echo "image_sha must be 40 lowercase hexadecimal characters" >&2; exit 1; fi
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          set +e
          aws ecr batch-get-image --region "$AWS_REGION" --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$IMAGE_SHA" --output json > /tmp/batch-get-image.json
          BATCH_STATUS=$?
          set -e
          if [ "$BATCH_STATUS" -ne 0 ]; then echo "ECR BatchGetImage API failed" >&2; exit "$BATCH_STATUS"; fi
          set +e
          IMAGE_STATE=$(python3 - /tmp/batch-get-image.json "$IMAGE_SHA" <<'PY'
          import json, sys
          try:
              with open(sys.argv[1], encoding="utf-8") as stream: response = json.load(stream)
              if not isinstance(response, dict): raise ValueError("malformed BatchGetImage response")
              images, failures = response.get("images"), response.get("failures")
              if not isinstance(images, list) or not isinstance(failures, list) or any(not isinstance(item, dict) for item in images + failures): raise ValueError("malformed BatchGetImage response")
              requested = sys.argv[2]
              if len(images) == 1 and not failures:
                  image_id = images[0].get("imageId")
                  if not isinstance(image_id, dict) or image_id.get("imageTag") != requested: raise ValueError("unexpected BatchGetImage image")
                  print("exists")
              elif not images and len(failures) == 1 and failures[0].get("failureCode") == "ImageNotFound":
                  failure_id = failures[0].get("imageId")
                  if failure_id is not None and (not isinstance(failure_id, dict) or failure_id.get("imageTag") != requested): raise ValueError("unexpected BatchGetImage failure image")
                  print("missing")
              else: raise ValueError("unexpected BatchGetImage response")
          except (OSError, ValueError, TypeError, json.JSONDecodeError) as error:
              print(error, file=sys.stderr); sys.exit(2)
          PY
          )
          PARSE_STATUS=$?
          set -e
          if [ "$PARSE_STATUS" -ne 0 ]; then echo "Malformed or unexpected ECR BatchGetImage response" >&2; exit "$PARSE_STATUS"; fi
          if [ "$IMAGE_STATE" = "missing" ]; then
            if [ -n "$REQUESTED_IMAGE_SHA" ]; then echo "Requested rollback image does not exist in ECR" >&2; exit 1; fi
            docker build -t "$ECR_REPOSITORY_URL:$IMAGE_SHA" .
            docker push "$ECR_REPOSITORY_URL:$IMAGE_SHA"
          elif [ "$IMAGE_STATE" != "exists" ]; then echo "Unexpected image state: $IMAGE_STATE" >&2; exit 1; fi
          echo "image_sha=$IMAGE_SHA" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout runtime definition
        uses: actions/checkout@v5

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_TEST_SERVER_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      # docker compose pull/up과 헬스체크를 하나의 SSM 명령으로 묶는다.
      # 헬스체크가 실패하면 이 명령 자체가 실패 상태로 끝나고, 그 상태를
      # 아래 단계가 그대로 workflow 실패로 이어받는다.
      - name: Deploy over SSM and wait for health check
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          INSTANCE_ID: ${{ vars.TEST_SERVER_INSTANCE_ID }}
          ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
          IMAGE_SHA: ${{ needs.build-and-push.outputs.image_sha }}
          REQUESTED_IMAGE_SHA: ${{ inputs.image_sha }}
          SSM_PARAMETER_PATH_PREFIX: ${{ vars.TEST_SERVER_SSM_PARAMETER_PATH_PREFIX }}
        run: |
          set -euo pipefail

          if ! [[ "$ECR_REPOSITORY_URL" =~ ^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com(\.cn)?/[a-z0-9][a-z0-9._/-]*$ ]] || [[ "$ECR_REPOSITORY_URL" == */*//* || "$ECR_REPOSITORY_URL" == */ ]]; then
            echo "Invalid ECR_REPOSITORY_URL" >&2; exit 1
          fi
          if ! [[ "$IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid resolved image SHA" >&2; exit 1
          fi
          if ! [[ "$SSM_PARAMETER_PATH_PREFIX" =~ ^/[a-zA-Z0-9_./-]+$ ]] || [[ "$SSM_PARAMETER_PATH_PREFIX" == */ || "$SSM_PARAMETER_PATH_PREFIX" == *//* ]]; then
            echo "Invalid TEST_SERVER_SSM_PARAMETER_PATH_PREFIX" >&2; exit 1
          fi
          export IMAGE_REF="$ECR_REPOSITORY_URL:$IMAGE_SHA"

          python3 - <<'PY'
          import json, os, subprocess, sys, time
          from pathlib import Path

          def aws(arguments, timeout=None):
              return subprocess.run(
                  ["aws", "--region", os.environ["AWS_REGION"], *arguments],
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=True, timeout=timeout,
              ).stdout

          stage = "payload"
          try:
              template = Path("infra/modules/app-server/user_data.sh.tftpl").read_text(encoding="utf-8")
              runtime = template.split("# BEGIN QELLO RUNTIME\n", 1)[1].split("# END QELLO RUNTIME\n", 1)[0]
              settings = {
                  "region": os.environ["AWS_REGION"],
                  "image": os.environ["IMAGE_REF"],
                  "prefix": os.environ["SSM_PARAMETER_PATH_PREFIX"],
                  "rollback": bool(os.environ["REQUESTED_IMAGE_SHA"]),
              }
              # metadata만 포함한다. 비밀값은 호스트의 EC2 identity로 조회한다.
              script = runtime + "\nsys.exit(deploy(" + repr(settings) + "))\n"
              parameters = json.dumps({"commands": ["python3 - <<'PY_HOST'\n" + script + "PY_HOST"]})
              wait_timeout = int(os.environ.get("QELLO_SSM_WAIT_TIMEOUT_SECONDS", "900"))
              delay = int(os.environ.get("QELLO_SSM_WAIT_INTERVAL_SECONDS", "5"))
              if min(wait_timeout, delay) <= 0:
                  raise ValueError()
              stage = "send"
              command_id = json.loads(aws([
                  "ssm", "send-command", "--instance-ids", os.environ["INSTANCE_ID"],
                  "--document-name", "AWS-RunShellScript", "--comment", "deploy-test-server (#231)",
                  "--parameters", parameters, "--output", "json",
              ]))["Command"]["CommandId"]
              deadline = time.monotonic() + wait_timeout
              stage = "status"
              while True:
                  remaining = deadline - time.monotonic()
                  if remaining <= 0:
                      print("[qello] deployment status UNKNOWN", file=sys.stderr)
                      sys.exit(1)
                  try:
                      invocation = json.loads(aws([
                          "ssm", "get-command-invocation", "--command-id", command_id,
                          "--instance-id", os.environ["INSTANCE_ID"], "--output", "json",
                      ], timeout=min(30, remaining)))
                  except (subprocess.CalledProcessError, subprocess.TimeoutExpired):
                      # InvocationDoesNotExist와 일시적 조회 장애에도 명령을 재전송하지 않는다.
                      invocation = None
                  if invocation is not None and invocation["Status"] not in ("Pending", "InProgress", "Delayed", "Cancelling"):
                      break
                  remaining = deadline - time.monotonic()
                  if remaining > 0:
                      time.sleep(min(delay, remaining))
                  delay = min(delay * 2, 30)
              if invocation["Status"] != "Success":
                  print("[qello] deployment remote FAILED", file=sys.stderr)
                  sys.exit(1)
              print("[qello] deployment complete OK")
          except Exception:
              print("[qello] deployment " + stage + " FAILED", file=sys.stderr)
              sys.exit(1)
          PY
