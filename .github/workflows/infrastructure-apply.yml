name: Infrastructure Apply

on:
  workflow_dispatch:
    inputs:
      jira_key:
        description: Jira key approved for this change
        required: true
        type: string
      pr_number:
        description: Open, approved infrastructure PR number
        required: true
        type: number
      terraform_dir:
        description: Repository-relative Terraform root under infra/
        required: true
        type: string
      confirmation:
        description: Type "APPLY <JIRA-KEY> PR-<NUMBER>"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  apply:
    if: vars.INFRA_APPLY_ENABLED == 'true'
    environment: infrastructure-apply
    runs-on: ubuntu-latest
    concurrency:
      group: infrastructure-apply
      cancel-in-progress: false
    steps:
      - name: Checkout approved pull request head
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate explicit confirmation and path
        run: >-
          python scripts/confirm-infra-apply.py
          --jira-key "${{ inputs.jira_key }}"
          --pr-number "${{ inputs.pr_number }}"
          --confirmation "${{ inputs.confirmation }}"
          --terraform-dir "${{ inputs.terraform_dir }}"

      - name: Verify both backend approvals on the exact head
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/verify-infra-approvals.py
          --repository "${{ github.repository }}"
          --pr-number "${{ inputs.pr_number }}"
          --required-reviewers Byuntil tkv00

      - name: Scan tracked files
        run: python scripts/preflight.py

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_INFRA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Initialize Terraform
        run: terraform -chdir="${{ inputs.terraform_dir }}" init -input=false

      - name: Create reviewed plan without printing values
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="${{ inputs.terraform_dir }}" plan \
            -input=false \
            -out="$RUNNER_TEMP/approved.tfplan" \
            >"$RUNNER_TEMP/terraform-plan.log" 2>&1
          echo "Terraform plan completed. Output is intentionally not printed."

      - name: Apply the exact approved plan
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="${{ inputs.terraform_dir }}" apply \
            -input=false \
            -auto-approve \
            "$RUNNER_TEMP/approved.tfplan" \
            >"$RUNNER_TEMP/terraform-apply.log" 2>&1
          echo "Terraform apply completed. Output is intentionally not printed."
