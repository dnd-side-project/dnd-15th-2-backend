name: Jira - apply backend issue to PR

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - ready_for_review

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  apply-jira-key:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
    steps:
      - name: Check out workflow scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Apply Jira key to PR
        run: node .github/scripts/sync-backend-pr.js

